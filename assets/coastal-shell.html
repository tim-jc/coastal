<script>
(function () {
  function installCoastalBrand() {
    var navbar = document.querySelector(".navbar");
    var logo = document.querySelector(".navbar-logo");
    var currentApp = document.querySelector(".navbar-brand");
    var toggle = document.getElementById("navbar-button");

    if (!navbar || !logo || !currentApp || navbar.dataset.ptgBrandInstalled) {
      return;
    }

    navbar.dataset.ptgBrandInstalled = "true";
    navbar.setAttribute("aria-label", "Coastal application navigation");

    var brand = document.createElement("a");
    var symbol = document.createElement("img");
    var wordmark = document.createElement("span");
    var brandDot = document.createElement("span");

    brand.className = "ptg-brand";
    brand.href = "https://pastthegrid.uk";
    brand.setAttribute("aria-label", "Past the Grid home");

    symbol.src = ["assets", "identity", "symbol.svg"].join("/");
    symbol.width = 30;
    symbol.height = 30;
    symbol.alt = "";
    symbol.setAttribute("aria-hidden", "true");

    wordmark.appendChild(document.createTextNode("Past the Grid"));
    brandDot.className = "ptg-brand-dot";
    brandDot.textContent = ".";
    wordmark.appendChild(brandDot);
    brand.appendChild(symbol);
    brand.appendChild(wordmark);
    logo.replaceChildren(brand);

    currentApp.innerHTML = [
      '<span class="ptg-brand-separator" aria-hidden="true">/</span>',
      '<span aria-current="page">Coastal</span>'
    ].join("");

    if (toggle && !toggle.getAttribute("aria-label")) {
      toggle.setAttribute("aria-label", "Toggle dashboard navigation");
    }
  }

  function captureLinkedValueBoxes() {
    document.querySelectorAll("span.value-output[data-href]").forEach(function (output) {
      var container = output.closest(".section.level3");
      var heading = container && container.querySelector("h3");

      if (!container) {
        return;
      }

      container.dataset.coastalValueHref = output.dataset.href;
      container.dataset.coastalValueName = [
        heading && heading.textContent.trim(),
        output.textContent.trim()
      ].filter(Boolean).join(": ");
    });
  }

  function installAccessibleValueBoxes() {
    var pending = document.querySelectorAll(
      "[data-coastal-value-href].linked-value:not([data-coastal-link-installed])"
    );

    pending.forEach(function (container) {
      var inner = Array.prototype.find.call(
        container.children,
        function (child) { return child.classList.contains("inner"); }
      );
      var icon = Array.prototype.find.call(
        container.children,
        function (child) { return child.classList.contains("icon"); }
      );

      if (!inner) {
        return;
      }

      if (window.jQuery) {
        window.jQuery(container).off("click.value-box");
      }

      var link = document.createElement("a");
      link.className = "coastal-value-box-link";
      link.href = container.dataset.coastalValueHref;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.setAttribute("aria-label", container.dataset.coastalValueName);

      container.insertBefore(link, inner);
      link.appendChild(inner);
      if (icon) {
        link.appendChild(icon);
      }
      container.dataset.coastalLinkInstalled = "true";
    });

    return document.querySelectorAll(
      "[data-coastal-value-href]:not([data-coastal-link-installed])"
    ).length === 0;
  }

  function installCoastalShell() {
    installCoastalBrand();
    captureLinkedValueBoxes();

    var observer = new MutationObserver(function () {
      if (installAccessibleValueBoxes()) {
        observer.disconnect();
      }
    });

    observer.observe(document.body, {
      attributes: true,
      childList: true,
      subtree: true
    });
    installAccessibleValueBoxes();
  }

  captureLinkedValueBoxes();

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", installCoastalShell);
  } else {
    installCoastalShell();
  }
}());
</script>
